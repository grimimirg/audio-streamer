<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📻 Audio Streamer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body id="mainBody">

<div class="glass-container">
    <div class="glass-header">
        <div class="header-left">
            <span class="logo-icon">📻</span>
            <span class="header-title">{{ radio_station_name }}</span>
        </div>
        <div class="header-controls">
            <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle theme">
                <span id="themeIcon">☀️</span>
            </button>
            <button onclick="window.open('/dashboard', '_blank')" class="theme-toggle-btn" title="Dashboard">
                <span>📊</span>
            </button>
            <div class="selector-box">
                <select id="languageDropdown" onchange="changeLanguage(this.value)">
                    <option value="it" data-i18n="language.it"></option>
                    <option value="en" data-i18n="language.en" selected></option>
                    <option value="de" data-i18n="language.de"></option>
                </select>
            </div>
        </div>
    </div>

    <div class="glass-content">
        <div class="visualizer-container">
            <canvas id="spectrumCanvas" class="spectrum-canvas"></canvas>
        </div>

        <div class="controls-container">
            <button id="playBtn" onclick="togglePlay()" class="play-btn"></button>
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volume" min="0" max="100" value="70"
                       oninput="changeVolume(this.value)" class="volume-slider">
                <span id="volumeValue" class="volume-value">70%</span>
            </div>
        </div>

        <div class="status-container">
            <div class="status-item">
                <span class="status-icon">🎧</span>
                <span class="listeners" id="listeners">0</span>
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <span id="connectionStatus" class="loading" data-i18n="status.ready"></span>
            </div>
        </div>
    </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/spectrum.js') }}"></script>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
