<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
    <title>{{ radio_station_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body id="mainBody">

<div class="top-right-controls">
    <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle theme">
        <span id="themeIcon">🌓</span>
    </button>
    <button onclick="openDashboard()" class="theme-toggle-btn" title="Dashboard">
        <span>📈</span>
    </button>
    <button id="historyToggleBtn" onclick="toggleHistory()" class="theme-toggle-btn" title="History">
        <span>🔄</span>
    </button>
    <div class="selector-box">
        <select id="languageDropdown" onchange="changeLanguage(this.value)">
            <option value="it" data-i18n="language.it"></option>
            <option value="en" data-i18n="language.en" selected></option>
            <option value="de" data-i18n="language.de"></option>
        </select>
    </div>
</div>

<div class="glass-container">
    <div class="glass-header">
        <div class="header-left">
            <img src="{{ url_for('static', filename='logo-icon.png') }}" class="logo-icon" alt="Logo">
            <span class="header-title">{{ radio_station_name }}</span>
        </div>
    </div>

    <div class="glass-content">
        <div class="track-info-container" id="trackInfoContainer" style="display: none; margin-bottom: 15px;">
            <div class="track-info-flex">
                <div class="track-cover" id="trackCover"
                     style="width: 120px; height: 120px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.1); display: none; flex-shrink: 0;">
                    <img id="trackCoverImg" src="" alt="Album Cover"
                         style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="track-details"
                     style="flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: center; max-width: 400px;">
                    <div class="track-artist" id="trackArtist"
                         style="font-size: 1.1rem; font-weight: bold; opacity: 0.9; margin-bottom: 8px;"></div>
                    <div class="track-album" id="trackAlbum"
                         style="font-size: 0.95rem; opacity: 0.8; margin-bottom: 5px;"></div>
                    <div class="track-title" id="trackTitle" style="font-size: 1.5rem; font-weight: bold;"></div>
                </div>
            </div>
        </div>

        <div class="visualizer-container">
            <canvas id="spectrumCanvas" class="spectrum-canvas"></canvas>
        </div>

        <div class="controls-container">
            <button id="playBtn" onclick="togglePlay()" class="play-btn"></button>
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volume" min="0" max="100" value="70"
                       oninput="changeVolume(this.value)" class="volume-slider">
                <span id="volumeValue" class="volume-value">70%</span>
            </div>
        </div>

        <div class="status-container">
            <div class="status-item">
                <span class="status-icon">🎧</span>
                <span class="listeners" id="listeners">0</span>
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <span id="connectionStatus" class="loading" data-i18n="status.ready"></span>
            </div>
        </div>
    </div>
</div>

<div id="historyPanel" class="history-panel">
    <div class="history-panel-header">
        <span data-i18n="player.history">Cronologia</span>
        <button onclick="toggleHistory()" class="history-close-btn">×</button>
    </div>
    <div id="historyStack" class="history-stack">
        <div class="history-empty" data-i18n="player.history_empty">Nessun brano nella cronologia</div>
    </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/spectrum.js') }}"></script>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
