<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📻 Audio Streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .radio-container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-style: italic;
        }

        .vinyl {
            font-size: 100px;
            animation: spin 3s linear infinite;
            display: inline-block;
            margin: 20px 0;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .controls {
            margin: 30px 0;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            margin: 10px;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .volume-control {
            margin: 20px 0;
        }

        input[type="range"] {
            width: 80%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1.1em;
        }

        .listeners {
            color: #4ade80;
            font-weight: bold;
        }

        .loading {
            color: #fbbf24;
            font-weight: bold;
        }

        .visualizer {
            height: 60px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            margin: 20px 0;
        }

        .bar {
            width: 8px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 4px;
            animation: pulse 0.8s ease-in-out infinite;
        }

        .bar:nth-child(1) {
            animation-delay: 0s;
        }

        .bar:nth-child(2) {
            animation-delay: 0.1s;
        }

        .bar:nth-child(3) {
            animation-delay: 0.2s;
        }

        .bar:nth-child(4) {
            animation-delay: 0.3s;
        }

        .bar:nth-child(5) {
            animation-delay: 0.4s;
        }

        .bar:nth-child(6) {
            animation-delay: 0.3s;
        }

        .bar:nth-child(7) {
            animation-delay: 0.2s;
        }

        .bar:nth-child(8) {
            animation-delay: 0.1s;
        }

        @keyframes pulse {
            0%, 100% {
                height: 10px;
            }
            50% {
                height: 50px;
            }
        }
    </style>
</head>
<body>
<div class="radio-container">
    <h1>📻 Audio Streamer</h1>
    <p class="subtitle">Live streaming from my analog devices</p>

    <div class="vinyl" id="vinyl">💿</div>

    <div class="visualizer" id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">▶️ Play</button>
    </div>

    <div class="volume-control">
        🔊 Volume: <span id="volumeValue">70</span>%
        <br>
        <input type="range" id="volume" min="0" max="100" value="70"
               oninput="changeVolume(this.value)">
    </div>

    <div class="status">
        🎧 Online listeners: <span class="listeners" id="listeners">0</span>
        <br>
        <span id="connectionStatus" class="loading">🔄 Ready to connect</span>
    </div>

    <audio id="audioPlayer" preload="none"></audio>
</div>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const vinyl = document.getElementById('vinyl');
    const visualizer = document.getElementById('visualizer');
    const connectionStatus = document.getElementById('connectionStatus');
    let isPlaying = false;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 3;

    function updateStatus(message, type = 'loading') {
        connectionStatus.textContent = message;
        connectionStatus.className = type;
    }

    function togglePlay() {
        if (!isPlaying) {
            startStreaming();
        } else {
            stopStreaming();
        }
    }

    function startStreaming() {
        updateStatus('🔄 Connecting to stream...', 'loading');
        playBtn.disabled = true;
        playBtn.textContent = '⏳ Connecting...';

        audio.src = '/stream';

        // Set up event listeners before playing
        audio.addEventListener('loadstart', onLoadStart);
        audio.addEventListener('canplay', onCanPlay);
        audio.addEventListener('error', onError);
        audio.addEventListener('stalled', onStalled);

        audio.play().catch(onPlayError);
    }

    function stopStreaming() {
        audio.pause();
        audio.src = '';

        // Remove event listeners
        audio.removeEventListener('loadstart', onLoadStart);
        audio.removeEventListener('canplay', onCanPlay);
        audio.removeEventListener('error', onError);
        audio.removeEventListener('stalled', onStalled);

        playBtn.textContent = '▶️ Play';
        playBtn.style.background = '#667eea';
        playBtn.disabled = false;
        vinyl.style.animationPlayState = 'paused';
        isPlaying = false;
        reconnectAttempts = 0;
        updateStatus('🔄 Ready to connect', 'loading');
    }

    function onLoadStart() {
        updateStatus('🔄 Buffering...', 'loading');
    }

    function onCanPlay() {
        playBtn.textContent = '⏸️ Pause';
        playBtn.style.background = '#f43f5e';
        playBtn.disabled = false;
        vinyl.style.animationPlayState = 'running';
        isPlaying = true;
        reconnectAttempts = 0;
        updateStatus('🎵 Streaming', 'listeners');
    }

    function onError(e) {
        console.error('Audio error:', e);

        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
            reconnectAttempts++;
            updateStatus(`🔄 Connection failed, retrying... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'error');

            setTimeout(() => {
                if (isPlaying) {
                    audio.load(); // Reload and try again
                    audio.play().catch(() => {
                    });
                }
            }, 2000);
        } else {
            updateStatus('❌ Connection failed. Check if server is running.', 'error');
            stopStreaming();
        }
    }

    function onStalled() {
        updateStatus('🔄 Buffering...', 'loading');
    }

    function onPlayError(error) {
        console.error('Play error:', error);
        updateStatus('❌ Failed to start playback', 'error');
        stopStreaming();
    }

    function changeVolume(value) {
        audio.volume = value / 100;
        document.getElementById('volumeValue').textContent = value;
    }

    // Update stats every 5 seconds
    setInterval(() => {
        fetch('/stats')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Stats request failed');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('listeners').textContent = data.listeners;

                // Update status based on server state
                if (isPlaying && !data.on_air) {
                    updateStatus('⚠️ Server stopped streaming', 'error');
                    stopStreaming();
                }
            })
            .catch(error => {
                console.error('Stats error:', error);
                if (isPlaying) {
                    updateStatus('⚠️ Connection to server lost', 'error');
                }
            });
    }, 5000);

    // Set initial volume
    audio.volume = 0.7;
</script>
</body>
</html>
