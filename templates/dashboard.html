<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
    <title>Dashboard - {{ radio_station_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-page">
<div class="top-right-controls">
    <button onclick="openPlayer()" class="theme-toggle-btn" title="Open Player">
        <span>🎧</span>
    </button>
    <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle theme">
        <span id="themeIcon">🌓</span>
    </button>
    <div class="selector-box">
        <select id="languageDropdown" onchange="changeLanguage(this.value)">
            <option value="it" data-i18n="language.it"></option>
            <option value="en" data-i18n="language.en" selected></option>
            <option value="de" data-i18n="language.de"></option>
        </select>
    </div>
</div>

<div class="container">
    <header>
        <h1>Dashboard - {{ radio_station_name }}</h1>
    </header>

    <div class="chart-container">
        <div class="chart-title">🎵 <span data-i18n="dashboard.now_playing"></span></div>
        <div class="now-playing-flex">
            <div style="width: 250px; flex-shrink: 0;">
                <div style="margin-bottom: 15px;">
                    <div class="info-label"><span data-i18n="dashboard.album_cover"></span></div>
                    <input type="url" id="albumCover" placeholder=""
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                </div>
                <div style="margin-bottom: 15px;">
                    <div class="info-label"><span data-i18n="dashboard.album_cover_upload"></span>
                    </div>
                    <input type="file" id="albumCoverFile" accept="image/*"
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                </div>
                <div id="dashboardCoverPreview" style="display: none;">
                    <div class="info-label" style="margin-bottom: 5px;"></div>
                    <div style="width: 150px; height: 150px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.1);">
                        <img id="dashboardCoverImg" src="" alt="Cover Preview"
                             style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>
            </div>
            <div style="flex: 1; min-width: 0;">
                <div style="margin-bottom: 15px;">
                    <div class="info-label"><span data-i18n="dashboard.artist"></span></div>
                    <input type="text" id="artistName" placeholder=""
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                </div>
                <div style="margin-bottom: 15px;">
                    <div class="info-label"><span data-i18n="dashboard.track_title"></span></div>
                    <input type="text" id="trackTitle" placeholder=""
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                </div>
                <div style="margin-bottom: 15px;">
                    <div class="info-label"><span data-i18n="dashboard.album_name"></span></div>
                    <input type="text" id="albumName" placeholder=""
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                </div>
                <div style="margin-bottom: 15px;">
                    <div class="info-label"><span data-i18n="dashboard.track_year"></span></div>
                    <input type="number" id="trackYear" placeholder=""
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                </div>
            </div>
            <div style="width: 300px; flex-shrink: 0;">
                <div class="info-label" style="margin-bottom: 10px;"><span
                        data-i18n="dashboard.history"></span></div>
                <div id="historyStack" class="history-stack">
                    <div class="history-empty" data-i18n="dashboard.history_empty"></div>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-top: 15px;">
            <div id="confirmationMessage" style="display: none; color: #4ade80; font-weight: 600;">
                ✓ <span data-i18n="dashboard.track_info_sent"></span>
            </div>
            <button class="btn" onclick="updateTrackInfo()">📤 <span
                    data-i18n="dashboard.send_to_player"></span></button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">
                <span>👥</span> <span data-i18n="dashboard.listeners"></span>
            </div>
            <div class="metric-value" id="listenersCount">0</div>
            <div class="metric-label"><span data-i18n="dashboard.connected_now"></span> (<span
                    data-i18n="dashboard.peak"></span>: <span id="peakListeners">0</span>)
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🎧</span> <span data-i18n="dashboard.audio_quality"></span>
            </div>
            <div class="metric-value" id="sampleRate">44.1k</div>
            <div class="metric-label"><span data-i18n="dashboard.sample_rate"></span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🔊</span> <span data-i18n="dashboard.channels"></span>
            </div>
            <div class="metric-value" id="channels">2</div>
            <div class="metric-label"><span data-i18n="dashboard.stereo_mono"></span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>⏱️</span> <span data-i18n="dashboard.uptime"></span>
            </div>
            <div class="metric-value" id="uptime">00:00</div>
            <div class="metric-label"><span data-i18n="dashboard.on_air"></span></div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">🎛️ <span data-i18n="dashboard.audio_info"></span></div>
        <div class="audio-info">
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.stream_status"></span></div>
                <div class="info-value" id="streamStatus">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.estimated_bitrate"></span></div>
                <div class="info-value" id="bitrate">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.audio_format"></span></div>
                <div class="info-value" id="format">WAV 16-bit</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.latency"></span></div>
                <div class="info-value" id="latency">~2s</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
