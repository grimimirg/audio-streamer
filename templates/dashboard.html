<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📻 Dashboard Streamer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            --container-bg: rgba(0, 0, 0, 0.6);
            --text-color: #ffffff;
            --accent-color: #667eea;
            --accent-hover: #764ba2;
            --success-color: #4CAF50;
            --warning-color: #ff9800;
            --error-color: #f44336;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --border-radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .chart-container {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .chart-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .audio-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .info-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .controls {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        body.light .btn {
            background: rgba(0, 0, 0, 0.3);
            color: #1a1a1a;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        body.light .btn:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .metric-value {
                font-size: 2rem;
            }
        }

        .selector-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .selector-box select {
            background: transparent;
            color: #ffffff;
            border: none;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
            min-width: 50px;
        }

        .selector-box select:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .selector-box select option {
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        body.light {
            --bg-gradient: linear-gradient(135deg, #a8a8a8 0%, #888888 100%);
            --container-bg: rgba(255, 255, 255, 0.5);
            --text-color: #1a1a1a;
            --accent-color: rgba(0, 0, 0, 0.1);
            --accent-hover: rgba(0, 0, 0, 0.2);
            --success-color: #4CAF50;
            --warning-color: #ff9800;
            --error-color: #f44336;
        }

        body.light .selector-box {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .selector-box select {
            color: #1a1a1a;
        }

        body.light .selector-box select option {
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a1a;
        }

        body.light .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .theme-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        body.light .card,
        body.light .status-bar,
        body.light .chart-container,
        body.light .controls {
            background: rgba(255, 255, 255, 0.5);
        }

        body.light .card-title,
        body.light .chart-title {
            color: #667eea;
        }

        body.light .info-item {
            background: rgba(0, 0, 0, 0.05);
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>📻 {{ radio_station_name }}</h1>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle theme">
                    <span id="themeIcon">☀️</span>
                </button>
                <div class="selector-box">
                    <select id="languageDropdown" onchange="changeLanguage(this.value)">
                        <option value="it" data-i18n="language.it"></option>
                        <option value="en" data-i18n="language.en"></option>
                        <option value="de" data-i18n="language.de"></option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">
                <span>👥</span> <span data-i18n="dashboard.listeners">Ascoltatori</span>
            </div>
            <div class="metric-value" id="listenersCount">0</div>
            <div class="metric-label"><span data-i18n="dashboard.connected_now">Connessi ora</span> (<span data-i18n="dashboard.peak">Picco</span>: <span id="peakListeners">0</span>)</div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🎵</span> <span data-i18n="dashboard.audio_quality">Qualità Audio</span>
            </div>
            <div class="metric-value" id="sampleRate">44.1k</div>
            <div class="metric-label"><span data-i18n="dashboard.sample_rate">Sample Rate Hz</span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🔊</span> <span data-i18n="dashboard.channels">Canali</span>
            </div>
            <div class="metric-value" id="channels">2</div>
            <div class="metric-label"><span data-i18n="dashboard.stereo_mono">Stereo/Mono</span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>⏱️</span> <span data-i18n="dashboard.uptime">Tempo di Attività</span>
            </div>
            <div class="metric-value" id="uptime">00:00</div>
            <div class="metric-label"><span data-i18n="dashboard.on_air">On Air</span></div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">🎛️ <span data-i18n="dashboard.audio_info">Informazioni Audio</span></div>
        <div class="audio-info">
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.stream_status">Stato Stream</span></div>
                <div class="info-value" id="streamStatus">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.estimated_bitrate">Bitrate Stimato</span></div>
                <div class="info-value" id="bitrate">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.audio_format">Formato Audio</span></div>
                <div class="info-value" id="format">WAV 16-bit</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.latency">Latenza</span></div>
                <div class="info-value" id="latency">~2s</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="openPlayer()">🎵 <span data-i18n="dashboard.open_player">Apri Player</span></button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script>
    // Variabili globali
    let socket;
    let errorCount = 0;
    let startTime = null;
    let uptimeInterval = null;
    const MAX_ERRORS = 3;

    // Inizializzazione
    document.addEventListener('DOMContentLoaded', async function () {
        await i18n.loadTranslations(i18n.getCurrentLang());
        updateStaticTexts();

        // Set English as default language
        const savedLang = localStorage.getItem('language') || 'en';
        document.getElementById('languageDropdown').value = savedLang;

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        const body = document.body;
        const themeIcon = document.getElementById('themeIcon');

        if (savedTheme === 'light') {
            body.classList.add('light');
            themeIcon.textContent = '🌙';
        } else {
            themeIcon.textContent = '☀️';
        }

        // Connect to WebSocket
        connectWebSocket();
    });

    // Update static texts with i18n
    function updateStaticTexts() {
        const elements = document.querySelectorAll('[data-i18n]');
        elements.forEach(element => {
            const key = element.getAttribute('data-i18n');
            element.textContent = i18n.t(key);
        });
    }

    function connectWebSocket() {
        socket = io();

        socket.on('connect', () => {
            console.log('WebSocket connected');
        });

        socket.on('stats', (data) => {
            updateUI(data);
            errorCount = 0;

            // Store start_time and start uptime counter
            if (data.start_time && !startTime) {
                startTime = data.start_time * 1000; // Convert to milliseconds
                startUptimeCounter();
            }
        });

        socket.on('disconnect', () => {
            console.log('WebSocket disconnected');
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
            }
        });

        socket.on('connect_error', (error) => {
            console.error('WebSocket connection error:', error);
            errorCount++;
            if (errorCount >= MAX_ERRORS) {
                showError(i18n.t('dashboard.too_many_errors'));
            } else {
                showError(i18n.t('dashboard.connection_error') + ' (' + errorCount + '/' + MAX_ERRORS + ')');
            }
        });
    }

    function startUptimeCounter() {
        if (uptimeInterval) {
            clearInterval(uptimeInterval);
        }

        uptimeInterval = setInterval(() => {
            if (startTime) {
                const now = Date.now();
                const uptimeSeconds = Math.floor((now - startTime) / 1000);
                document.getElementById('uptime').textContent = formatUptime(uptimeSeconds);
            }
        }, 1000);
    }

    function formatUptime(seconds) {
        if (seconds < 60) {
            return `${seconds}s`;
        } else if (seconds < 3600) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}m ${secs}s`;
        } else {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours}h ${minutes}m ${secs}s`;
        }
    }

    function toggleTheme() {
        const body = document.body;
        const themeIcon = document.getElementById('themeIcon');

        if (body.classList.contains('light')) {
            body.classList.remove('light');
            themeIcon.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        } else {
            body.classList.add('light');
            themeIcon.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        }
    }

    // Change language function
    async function changeLanguage(lang) {
        await i18n.loadTranslations(lang);
        localStorage.setItem('language', lang);
        updateStaticTexts();
    }

    // Gestione errori
    function showError(message) {
        console.error(message);
    }

    // Aggiorna l'interfaccia
    function updateUI(stats) {
        // Metriche principali
        document.getElementById('listenersCount').textContent = stats.listeners;
        document.getElementById('peakListeners').textContent = stats.peak_listeners || 0;
        document.getElementById('sampleRate').textContent = (stats.sample_rate / 1000).toFixed(1) + 'k';
        document.getElementById('channels').textContent = stats.channels + (stats.channels === 2 ? ' (Stereo)' : ' (Mono)');

        // Info audio
        document.getElementById('streamStatus').textContent = stats.on_air ? i18n.t('dashboard.active') : i18n.t('dashboard.inactive');
        document.getElementById('bitrate').textContent = calculateBitrate(stats.sample_rate, stats.channels);
    }

    // Calcola il bitrate
    function calculateBitrate(sampleRate, channels) {
        const bitrate = sampleRate * channels * 16; // 16-bit
        return (bitrate / 1000).toFixed(0) + ' kbps';
    }

    // Apri player
    function openPlayer() {
        window.open('/', '_blank');
    }
</script>
</body>
</html>
