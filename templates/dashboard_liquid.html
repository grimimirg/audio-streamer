<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
    <title>Dashboard - {{ radio_station_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-page">
<div class="top-right-controls">
    <button onclick="openPlayer()" class="theme-toggle-btn" title="Open Player">
        <span>🎧</span>
    </button>
    <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle theme">
        <span id="themeIcon">🌓</span>
    </button>
    <div class="selector-box">
        <select id="languageDropdown" onchange="changeLanguage(this.value)">
            <option value="it" data-i18n="language.it"></option>
            <option value="en" data-i18n="language.en" selected></option>
            <option value="de" data-i18n="language.de"></option>
        </select>
    </div>
</div>

<div class="container">
    <header>
        <h1>Dashboard - {{ radio_station_name }}</h1>
    </header>

    <!-- Scheduler and Local Music Sections Side by Side -->
    <div class="liquid-controls-row">
        <!-- Scheduler Section -->
        <div class="chart-container liquid-controls-container">
            <div class="chart-title">📋 <span data-i18n="dashboard.scheduler"></span></div>

            <div class="liquid-controls-content">
                <!-- Upload Section -->
                <div style="margin-bottom: 20px;">
                    <div class="info-label"><span data-i18n="dashboard.upload_tracks"></span></div>
                    <input type="file" id="trackUpload" accept=".mp3,.wav,.flac,.ogg,.m4a" multiple
                           style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                    <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                        <button class="btn" onclick="uploadTracks()">📤 <span
                                data-i18n="dashboard.upload"></span></button>
                        <div id="uploadStatus" style="color: #4ade80; font-weight: 600; margin-left: auto;"></div>
                    </div>
                </div>

                <!-- Playlist Display -->
                <div style="margin-bottom: 20px;">
                    <div class="info-label"><span data-i18n="dashboard.playlist"></span> (<span id="playlistCount">0</span>
                        tracks)
                    </div>
                    <div id="playlistContainer" class="history-stack" style="max-height: 300px; overflow-y: auto;">
                        <div class="history-empty" data-i18n="dashboard.playlist_empty"></div>
                    </div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="liquid-controls-footer">
                <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
                    <button class="btn" onclick="skipBackward()" title="Skip Backward">⏮️</button>
                    <button class="btn" onclick="stopPlayback()" title="Stop">⏹️</button>
                    <button class="btn" onclick="pausePlayback()" title="Pause">⏸️</button>
                    <button class="btn" onclick="resumePlayback()" title="Resume">▶️</button>
                    <button class="btn" onclick="startPlayback()" title="Play">▶️ Play</button>
                    <button class="btn" onclick="skipForward()" title="Skip Forward">⏭️</button>
                </div>
                <div id="playbackStatus" style="text-align: center; margin-top: 10px; color: #4ade80; font-weight: 600;"></div>
            </div>
        </div>

        <!-- Local Path Section -->
        <div class="chart-container liquid-controls-container">
            <div class="chart-title">📁 <span data-i18n="dashboard.local_music"></span></div>

            <div class="liquid-controls-content">
                <div style="margin-bottom: 20px;">
                    <div class="info-label"><span data-i18n="dashboard.local_path"></span></div>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input type="text" id="localPathInput" placeholder="/path/to/music/directory"
                               style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); font-size: 1rem;">
                        <button class="btn" onclick="openFolderSelector()" title="Browse folders">📁</button>
                    </div>
                    <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                        <button class="btn" id="loadLocalBtn" onclick="setLocalPath()">📂 <span
                                data-i18n="dashboard.load_local"></span></button>
                        <button class="btn" id="stopScanBtn" onclick="stopScan()" style="display: none; background: rgba(239, 68, 68, 0.3);">🛑 Stop Scan</button>
                        <div id="localPathStatus" style="color: #4ade80; font-weight: 600; margin-left: auto;"></div>
                    </div>
                </div>

                <!-- Folder Selector Modal -->
                <div id="folderSelectorModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
                    <div style="background: rgba(30, 30, 40, 0.95); padding: 30px; border-radius: 12px; width: 600px; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="margin: 0; color: white;">📁 Select Folder</h2>
                            <button onclick="closeFolderSelector()" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">✕</button>
                        </div>
                        <div id="folderBreadcrumb" style="margin-bottom: 15px; color: #9ca3af; font-size: 0.9rem;"></div>
                        <div id="folderList" style="min-height: 300px; max-height: 400px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 10px; background: rgba(0,0,0,0.3);"></div>
                        <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                            <button class="btn" onclick="closeFolderSelector()" style="background: rgba(255,255,255,0.1);">Cancel</button>
                            <button class="btn" onclick="selectFolder()" style="background: rgba(74, 222, 128, 0.3);">Select</button>
                        </div>
                    </div>
                </div>

                <!-- Playlist Display -->
                <div style="margin-bottom: 20px;">
                    <div class="info-label"><span data-i18n="dashboard.playlist"></span> (<span id="playlistCountLocal">0</span>
                        tracks)
                    </div>
                    <div id="playlistContainerLocal" class="history-stack" style="max-height: 300px; overflow-y: auto;">
                        <div class="history-empty" data-i18n="dashboard.playlist_empty"></div>
                    </div>
                </div>
            </div>

            <!-- Local Path Playback Controls -->
            <div class="liquid-controls-footer">
                <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
                    <button class="btn" onclick="skipBackward()" title="Skip Backward">⏮️</button>
                    <button class="btn" onclick="stopPlayback()" title="Stop">⏹️</button>
                    <button class="btn" onclick="pausePlayback()" title="Pause">⏸️</button>
                    <button class="btn" onclick="resumePlayback()" title="Resume">▶️</button>
                    <button class="btn" onclick="startPlayback()" title="Play">▶️ Play</button>
                    <button class="btn" onclick="skipForward()" title="Skip Forward">⏭️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Playback Stack Section -->
    <div class="chart-container">
        <div class="chart-title">📚 <span data-i18n="dashboard.playback_stack"></span></div>
        <div id="playbackStackContainer" class="history-stack" style="max-height: 300px; overflow-y: auto;">
            <div class="history-empty" data-i18n="dashboard.stack_empty"></div>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">
                <span>👥</span> <span data-i18n="dashboard.listeners"></span>
            </div>
            <div class="metric-value" id="listenersCount">0</div>
            <div class="metric-label"><span data-i18n="dashboard.connected_now"></span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🎧</span> <span data-i18n="dashboard.audio_quality"></span>
            </div>
            <div class="metric-value" id="sampleRate">44.1k</div>
            <div class="metric-label"><span data-i18n="dashboard.sample_rate"></span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🔊</span> <span data-i18n="dashboard.channels"></span>
            </div>
            <div class="metric-value" id="channels">2</div>
            <div class="metric-label"><span data-i18n="dashboard.stereo_mono"></span></div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>⏱️</span> <span data-i18n="dashboard.uptime"></span>
            </div>
            <div class="metric-value" id="uptime">00:00</div>
            <div class="metric-label"><span data-i18n="dashboard.on_air"></span></div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">🎛️ <span data-i18n="dashboard.audio_info"></span></div>
        <div class="audio-info">
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.stream_status"></span></div>
                <div class="info-value" id="streamStatus">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.current_track"></span></div>
                <div class="info-value" id="currentTrack">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.playback_state"></span></div>
                <div class="info-value" id="playbackState">---</div>
            </div>
            <div class="info-item">
                <div class="info-label"><span data-i18n="dashboard.playlist_length"></span></div>
                <div class="info-value" id="playlistLength">0</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard_liquid.js') }}"></script>

<style>
    .current-track {
        background: rgba(74, 222, 128, 0.2) !important;
        border-left: 3px solid #4ade80;
    }

    .liquid-controls-row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .liquid-controls-row .chart-container {
        flex: 1;
        min-width: 0;
    }

    .liquid-controls-container {
        display: flex;
        flex-direction: column;
    }

    .liquid-controls-content {
        flex: 1;
    }

    .liquid-controls-footer {
        margin-top: auto;
        padding-top: 20px;
    }

    @media (max-width: 768px) {
        .liquid-controls-row {
            flex-direction: column;
        }
    }
</style>
</body>
</html>
