{% import "components/icons.html" as icons %}
{% macro top_controls(show_player_btn=false, show_dashboard_btn=false, show_history_btn=false) %}
<div class="top-right-controls" x-data="{
    isLight: localStorage.getItem('theme') === 'light',
    language: localStorage.getItem('language') || 'en',
    toggleTheme() {
        this.isLight = !this.isLight;
        localStorage.setItem('theme', this.isLight ? 'light' : 'dark');
        document.body.classList.toggle('light', this.isLight);
    },
    changeLanguage(lang) {
        this.language = lang;
        localStorage.setItem('language', lang);
        if (typeof changeLanguage === 'function') {
            changeLanguage(lang);
        }
    },
    init() {
        document.body.classList.toggle('light', this.isLight);
        $el.querySelector('#languageDropdown').value = this.language;
    }
}">
    {% if show_player_btn %}
    <button onclick="openPlayer()" class="theme-toggle-btn" title="Open Player">
        {{ icons.icon('headphones') }}
    </button>
    {% endif %}
    {% if show_dashboard_btn %}
    <button onclick="openDashboard()" class="theme-toggle-btn" title="Dashboard">
        {{ icons.icon('chart') }}
    </button>
    {% endif %}
    {% if show_history_btn %}
    <button id="historyToggleBtn" onclick="toggleHistory()" class="theme-toggle-btn" title="History">
        {{ icons.icon('history') }}
    </button>
    {% endif %}
    <button @click="toggleTheme()" class="theme-toggle-btn" title="Toggle theme">
        <span x-show="!isLight">{{ icons.icon('sun') }}</span>
        <span x-show="isLight">{{ icons.icon('moon') }}</span>
    </button>
    <div class="selector-box">
        <select id="languageDropdown" x-model="language" @change="changeLanguage($el.value)">
            <option value="it" data-i18n="language.it"></option>
            <option value="en" data-i18n="language.en"></option>
            <option value="de" data-i18n="language.de"></option>
        </select>
    </div>
</div>
{% endmacro %}
